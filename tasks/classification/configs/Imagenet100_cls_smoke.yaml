# SMOKE TEST ONLY — throwaway config to validate the imagenet100 code path end to
# end on a busy/shared GPU. Trains on the small val/ folder (~13k imgs) so 1 epoch
# is fast; exercises the same ImageFolder+TransformSubset branch, clean-train line,
# EVAL_SNR sweep and curve saving as the real run. Delete its LOG dir afterwards.
TRAIN:
  EPOCHS: 1
  SAVE_FRE: 1
  EVAL_FRE: 1
  LOSS: 'CLS'
  EVAL_MATRIX: 'ACC'
  BASE_LR: 0.0001
  WEIGHT_DECAY: 0.05
  LOG_PATH: '/home/LYC/lcy/MambaJSCCcheckpoints/Imagenet100_cls_SMOKE/logs/'
  GAN_LOSS: False
MODEL:
  DROP_PATH_RATE: 0.1
  VSSM:
    MLP_DROP_RATE: 0.0
DATA:
  DATASET: "imagenet100"
  TRAIN_BATCH: 24
  TEST_BATCH: 24
  IMG_SIZE: 128
  STRONG_AUG: True
  train_data_dir: "/home/LYC/lcy/Datasets/imagenet-100/split/val"
  val_data_dir: "/home/LYC/lcy/Datasets/imagenet-100/split/test"
  test_data_dir: "/home/LYC/lcy/Datasets/imagenet-100/split/test"
CHANNEL:
  TYPE: 'awgn'
  SNR: [1, 3, 5, 7, 9, 11, 13, 15, 17, 20]
  EVAL_SNR: [1, 20]
  ADAPTIVE: 'ssm'
CLS:
  STAGE: "from_scratch"
  NUM_CLASSES: 100
  SNR_EMBED_DIM: 32
  HEAD_HIDDEN_DIM: 256
  HEAD_DROPOUT: 0.1
  HEAD_LR: 0.001
  HEAD_WEIGHT_DECAY: 0.05
  USE_SNR_EMBED: True
  LABEL_SMOOTHING: 0.1
  MIXUP_ALPHA: 0.2
  ENCODER_PATH: '/home/LYC/lcy/MambaJSCCcheckpoints/Imagenet100_cls_SMOKE/encoder/'
  CLASSIFIER_PATH: '/home/LYC/lcy/MambaJSCCcheckpoints/Imagenet100_cls_SMOKE/classifier/'
  PRETRAIN_ENCODER: ""
  PRETRAIN_CLASSIFIER: ""
