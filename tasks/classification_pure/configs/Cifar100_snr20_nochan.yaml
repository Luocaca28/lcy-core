# PURE_CLS ladder tier (2): SNR=20, NO channel, but full comm STRUCTURE.
# Identical to Cifar100_pure_cls.yaml EXCEPT: ADAPTIVE='ssm' (CSI-ReST on) and
# USE_SNR_EMBED=True. The encoder + head are fed a constant 20 dB (see _FIXED_SNR
# in train_pure_cls.py) but the feature never passes a channel (z_hat = feature).
# Structurally byte-identical to the comm version (tier 3) -- the only difference
# vs tier 3 is the absence of channel noise. Keep ALL other hyperparameters equal
# to tier (1) so the (1) vs (2) diff isolates the CSI-ReST/SNR-embed mechanism.
# Removable baseline -- see MANIFEST.md.
TRAIN:
  EPOCHS: 100
  SAVE_FRE: 10
  EVAL_FRE: 10
  LOSS: 'CLS'
  EVAL_MATRIX: 'ACC'
  BASE_LR: 0.0001
  WEIGHT_DECAY: 0.1
  LOG_PATH: '/home/LYC/lcy/MambaJSCCcheckpoints/PURE_CLS/Cifar100_snr20_nochan/logs/'
  GAN_LOSS: False
MODEL:
  DROP_PATH_RATE: 0.3
  VSSM:
    MLP_DROP_RATE: 0.1
DATA:
  DATASET: "CIFAR100"
  TRAIN_BATCH: 32
  TEST_BATCH: 32
  IMG_SIZE: 128
  VAL_RATIO: 0.1
  VAL_SEED: 42
  STRONG_AUG: True
  train_data_dir: "/home/LYC/lcy/Datasets/"
  val_data_dir: "/home/LYC/lcy/Datasets/"
  test_data_dir: "/home/LYC/lcy/Datasets/"
CHANNEL:
  TYPE: 'awgn'
  SNR: [20]
  ADAPTIVE: 'ssm'    # CSI-ReST ON (structure matches comm version)
CLS:
  STAGE: "from_scratch"
  NUM_CLASSES: 100
  SNR_EMBED_DIM: 32
  HEAD_HIDDEN_DIM: 256
  HEAD_DROPOUT: 0.5
  HEAD_LR: 0.001
  HEAD_WEIGHT_DECAY: 0.1
  USE_SNR_EMBED: True   # SNR embed ON (fed a constant 20 dB)
  LABEL_SMOOTHING: 0.1
  MIXUP_ALPHA: 0.2
  ENCODER_PATH: '/home/LYC/lcy/MambaJSCCcheckpoints/PURE_CLS/Cifar100_snr20_nochan/cls_encoder/'
  CLASSIFIER_PATH: '/home/LYC/lcy/MambaJSCCcheckpoints/PURE_CLS/Cifar100_snr20_nochan/classifier/'
  PRETRAIN_ENCODER: ""
  PRETRAIN_CLASSIFIER: ""
