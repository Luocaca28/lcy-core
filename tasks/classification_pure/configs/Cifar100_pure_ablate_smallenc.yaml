# Overfitting ablation Run A: SMALLER ENCODER (single variable vs tier1 pure).
# Identical to Cifar100_pure_cls.yaml EXCEPT it is launched with
# --model_config configs/vssm/vssm_tiny_CIFAR100_smallenc.yaml (reduced EMBED_DIM/
# DEPTHS). Isolated product paths so it never collides with tier1. See
# tasks/classification_pure/MANIFEST.md for the ladder context.
TRAIN:
  EPOCHS: 100
  SAVE_FRE: 10
  EVAL_FRE: 10
  LOSS: 'CLS'
  EVAL_MATRIX: 'ACC'
  BASE_LR: 0.0001
  WEIGHT_DECAY: 0.1
  LOG_PATH: '/home/LYC/lcy/MambaJSCCcheckpoints/PURE_CLS/Cifar100_ablate_smallenc/logs/'
  GAN_LOSS: False
MODEL:
  DROP_PATH_RATE: 0.3
  VSSM:
    MLP_DROP_RATE: 0.1
DATA:
  DATASET: "CIFAR100"
  TRAIN_BATCH: 8       # 8 per GPU x 4 GPUs (DDP) = effective batch 32, matched to tier1
  TEST_BATCH: 32
  IMG_SIZE: 128
  VAL_RATIO: 0.1
  VAL_SEED: 42
  STRONG_AUG: True
  train_data_dir: "/home/LYC/lcy/Datasets/"
  val_data_dir: "/home/LYC/lcy/Datasets/"
  test_data_dir: "/home/LYC/lcy/Datasets/"
CHANNEL:
  TYPE: 'awgn'
  SNR: [20]
  ADAPTIVE: 'no'
CLS:
  STAGE: "from_scratch"
  NUM_CLASSES: 100
  SNR_EMBED_DIM: 32
  HEAD_HIDDEN_DIM: 256
  HEAD_DROPOUT: 0.5
  HEAD_LR: 0.001
  HEAD_WEIGHT_DECAY: 0.1
  USE_SNR_EMBED: False
  LABEL_SMOOTHING: 0.1
  MIXUP_ALPHA: 0.2
  ENCODER_PATH: '/home/LYC/lcy/MambaJSCCcheckpoints/PURE_CLS/Cifar100_ablate_smallenc/cls_encoder/'
  CLASSIFIER_PATH: '/home/LYC/lcy/MambaJSCCcheckpoints/PURE_CLS/Cifar100_ablate_smallenc/classifier/'
  PRETRAIN_ENCODER: ""
  PRETRAIN_CLASSIFIER: ""
