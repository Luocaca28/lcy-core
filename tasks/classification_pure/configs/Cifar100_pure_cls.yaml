# PURE_CLS baseline config: pure-compression classification on CIFAR-100, NO channel.
# 32x32 images are interpolated to IMG_SIZE=128 inside the pipeline. DefScan third
# branch stays ON via the shared model config (vssm_tiny_CIFAR10_multitask_defscan.yaml:
# USE_DEFSCAN=True, OUT_CHANS=32). Regularization matches the earlier CIFAR-100
# experiment (CIFAR-100 overfits easily). Removable baseline -- see MANIFEST.md.
TRAIN:
  EPOCHS: 100
  SAVE_FRE: 10
  EVAL_FRE: 10
  LOSS: 'CLS'
  EVAL_MATRIX: 'ACC'
  BASE_LR: 0.0001
  WEIGHT_DECAY: 0.1
  LOG_PATH: '/home/LYC/lcy/MambaJSCCcheckpoints/PURE_CLS/Cifar100_pure_cls/logs/'
  GAN_LOSS: False
MODEL:
  DROP_PATH_RATE: 0.3
  VSSM:
    MLP_DROP_RATE: 0.1
DATA:
  DATASET: "CIFAR100"
  TRAIN_BATCH: 32
  TEST_BATCH: 32
  IMG_SIZE: 128
  VAL_RATIO: 0.1
  VAL_SEED: 42
  STRONG_AUG: True
  train_data_dir: "/home/LYC/lcy/Datasets/"
  val_data_dir: "/home/LYC/lcy/Datasets/"
  test_data_dir: "/home/LYC/lcy/Datasets/"
CHANNEL:
  TYPE: 'awgn'
  SNR: [20]          # inert: read only by checkpoint_tag / build_latent_classifier
  ADAPTIVE: 'no'     # encoder does no SNR conditioning -> pure compression
CLS:
  STAGE: "from_scratch"
  NUM_CLASSES: 100
  SNR_EMBED_DIM: 32
  HEAD_HIDDEN_DIM: 256
  HEAD_DROPOUT: 0.5
  HEAD_LR: 0.001
  HEAD_WEIGHT_DECAY: 0.1
  USE_SNR_EMBED: False  # head ignores SNR (no channel)
  LABEL_SMOOTHING: 0.1
  MIXUP_ALPHA: 0.2
  ENCODER_PATH: '/home/LYC/lcy/MambaJSCCcheckpoints/PURE_CLS/Cifar100_pure_cls/cls_encoder/'
  CLASSIFIER_PATH: '/home/LYC/lcy/MambaJSCCcheckpoints/PURE_CLS/Cifar100_pure_cls/classifier/'
  PRETRAIN_ENCODER: ""
  PRETRAIN_CLASSIFIER: ""
